name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: proj
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            mkdir -p app
            unzip -o "$ZIP" -d app
          fi
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -1)
          if [ -z "$SPEC" ]; then
            echo "no buildozer.spec found"
            ls -R | head -60
            exit 1
          fi
          echo "dir=$(dirname "$SPEC")" >> "$GITHUB_OUTPUT"

      - name: Pin python-for-android and NDK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          sed -i '/^p4a.branch/d;/^android.ndk *=/d' buildozer.spec
          sed -i '0,/^\[app\]/s//[app]\np4a.branch = v2024.01.21\nandroid.ndk = 25b/' buildozer.spec
          head -6 buildozer.spec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer "cython==0.29.36" setuptools virtualenv

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: buildozer android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Save error summary
        if: always()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/clean.log" || true
          grep -n -E " error: |Command failed|ERROR:|BUILD FAILED" "$GITHUB_WORKSPACE/clean.log" | grep -v "No matching distribution" | cut -c1-300 | tail -20 > "$GITHUB_WORKSPACE/error-tail.txt" || true
          {
            echo '### Errors'
            echo '```'
            cat "$GITHUB_WORKSPACE/error-tail.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-tail
          path: error-tail.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plates-match-apk
          path: ${{ steps.proj.outputs.dir }}/bin/*.apk
