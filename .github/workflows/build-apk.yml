name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: proj
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            mkdir -p app
            unzip -o "$ZIP" -d app
          fi
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -1)
          if [ -z "$SPEC" ]; then
            echo "لم أجد zip ولا buildozer.spec في المستودع. الملفات الموجودة:"
            ls -R | head -60
            exit 1
          fi
          echo "dir=$(dirname "$SPEC")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer "cython==0.29.36" setuptools virtualenv

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plates-match-apk
          path: ${{ steps.proj.outputs.dir }}/bin/*.apk
