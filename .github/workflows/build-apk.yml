name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        id: proj
        run: |
          mkdir -p app
          unzip -o ./*.zip -d app
          SPEC=$(find app -name buildozer.spec | head -1)
          echo "dir=$(dirname "$SPEC")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer "cython==0.29.36" setuptools virtualenv

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plates-match-apk
          path: ${{ steps.proj.outputs.dir }}/bin/*.apk
